
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openeasd
      POSTGRES_USER: openeasd
      POSTGRES_PASSWORD: "REPLACE_WITH_CURRENT_DB_PASSWORD"
    volumes:
      - openeasd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openeasd -d openeasd"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "8000:8000"
    volumes:
      - openeasd_logs:/app/logs
    environment: &app_env
      OPENEASD_ROLE: "web"
      SECRET_KEY: "REPLACE_WITH_YOUR_EXISTING_SECRET_KEY"
      DEBUG: "false"
      ALLOWED_HOSTS: "localhost,127.0.0.1,192.168.9.176"
      CSRF_TRUSTED_ORIGINS: "http://192.168.9.176:8000"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_NAME: "openeasd"
      DB_USER: "openeasd"
      DB_PASSWORD: "REPLACE_WITH_CURRENT_DB_PASSWORD"
      DBOS_SCAN_CONCURRENCY: "2"
      TOOL_SUBFINDER: "/usr/local/bin/pdtm-tools/subfinder"
      TOOL_DNSX: "/usr/local/bin/pdtm-tools/dnsx"
      TOOL_NAABU: "/usr/local/bin/pdtm-tools/naabu"
      TOOL_HTTPX: "/usr/local/bin/pdtm-tools/httpx"
      TOOL_NUCLEI: "/usr/local/bin/pdtm-tools/nuclei"
      TOOL_AMASS: "/usr/local/bin/amass"
      TOOL_NMAP: "nmap"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    cap_add:
      - NET_RAW
    volumes:
      - openeasd_logs:/app/logs
    environment:
      <<: *app_env
      OPENEASD_ROLE: "worker"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  openeasd_pgdata:
  openeasd_logs:
